spring:
  application:
    name: body-simulator
  profiles:
    active: dev
  datasource:
    # All database settings are injected through JVM system properties (-D...)
    # or environment variables. No connection-specific values are committed.
    url: "jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}?sslmode=${SUPABASE_DB_SSLMODE}"
    username: "${SUPABASE_DB_USERNAME}"
    password: "${SUPABASE_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep pooled connections shorter than the Supabase Pooler/server limit.
      max-lifetime: 300000
      keepalive-time: 120000
      validation-timeout: 5000
      connection-timeout: 30000
  flyway:
    # Schema is provisioned already; do not create or alter tables on service startup.
    enabled: false
    # If migrations are explicitly enabled in a provisioning profile, baseline
    # at version 0 so the application's V1 migration is still executed.
    baseline-on-migrate: true
    baseline-version: 0
    default-schema: public
    schemas: public

server:
  port: 8089
  servlet:
    context-path: /

# Supabase Auth is the identity provider. The API only validates its access
# tokens; the private/service-role key must never be configured here.
security:
  supabase:
    # REST endpoint used when a future adapter needs to call Supabase PostgREST.
    api-url: "${SUPABASE_API_URL:https://csvmlhpsxfepglbdkhcq.supabase.co/rest/v1}"
    issuer-uri: "${SUPABASE_ISSUER_URI:https://csvmlhpsxfepglbdkhcq.supabase.co/auth/v1}"
    jwk-set-uri: "${SUPABASE_JWK_SET_URI:https://csvmlhpsxfepglbdkhcq.supabase.co/auth/v1/.well-known/jwks.json}"
    # Only needed for projects still using the legacy HS256 signing secret.
    jwt-secret: "${SUPABASE_JWT_SECRET:}"
    audience: "${SUPABASE_JWT_AUDIENCE:authenticated}"
